<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E55" />
      <stop offset="50%" stop-color="#2D116D" />
      <stop offset="100%" stop-color="#890C7D" />
    </linearGradient>
    <linearGradient id="mic-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F9FF" />
      <stop offset="100%" stop-color="#1E38B0" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F9FF" />
      <stop offset="100%" stop-color="#C220A8" />
    </linearGradient>
    <linearGradient id="leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7032BB" />
      <stop offset="100%" stop-color="#D928B3" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="40" height="40" rx="8" fill="url(#bg)" />

  <!-- Background border effect (subtle) -->
  <rect width="40" height="40" rx="8" fill="none" stroke="#25E3FF" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Top Mic part -->
  <path d="M 16 11 C 16 8.5, 22 8.5, 22 11 V 15 H 16 Z" fill="url(#mic-top)" />
  <!-- Horizontal cuts in top mic part -->
  <line x1="20" y1="13" x2="22" y2="13" stroke="#2D116D" stroke-width="1" />
  <line x1="20" y1="14.5" x2="22" y2="14.5" stroke="#2D116D" stroke-width="1" />

  <!-- Bottom Mic part (White) -->
  <path d="M 16 16 V 20 C 16 23, 22 23, 22 20 V 16 Z" fill="#FFFFFF" />
  <!-- Cutout on the left of bottom part -->
  <path d="M 16 17 H 18.5 V 19 H 16 Z" fill="url(#bg)" />

  <!-- Waves -->
  <path d="M 23 8 A 5 5 0 0 1 26 13" fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 25 6 A 8 8 0 0 1 29 14" fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 27 4 A 11 11 0 0 1 32 15" fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Brackets { } -->
  <path d="M 14 16 C 12 16, 12 18, 10 19 C 12 20, 12 22, 14 22" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 24 16 C 26 16, 26 18, 28 19 C 26 20, 26 22, 24 22" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Legs -->
  <!-- Left Leg -->
  <line x1="18" y1="23" x2="15" y2="28" stroke="url(#leg)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right Leg -->
  <line x1="20" y1="23" x2="23" y2="28" stroke="url(#leg)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center White Leg -->
  <line x1="19" y1="22.5" x2="17" y2="28.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

</svg>
